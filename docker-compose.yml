# Полный стек КТРУ-классификатора: 6 сервисов.
# Запуск: cp .env.example .env && docker compose up --build
# Интерфейс: http://localhost:3000, Swagger: http://localhost:8000/docs

name: ktru

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://app:app@db:5432/ktru
  REDIS_URL: redis://redis:6379/0
  ML_URL: http://ml:8000
  UPLOADS_DIR: /data/uploads

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build: ./backend
    command: sh -c "python -m app.wait_tables && celery -A app.workers.celery_app worker --loglevel=info --concurrency=2"
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ml:
    build: ./ml
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ktru
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ktru"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  uploads:
  models:
